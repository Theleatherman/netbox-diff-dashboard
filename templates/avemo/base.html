<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title or "NetBox Diff Dashboard" }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap">
  <script src="https://kit.fontawesome.com/a74e1218e8.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='themes/avemo/avemo.css') }}">
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
  <link rel="stylesheet" href="https://cdn.datatables.net/buttons/2.4.1/css/buttons.dataTables.min.css">
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='apple-icon.png') }}">
</head>
<body class="page-{{ active_page or 'home' }}">
  <div class="page-overlay"></div>
  <header class="site-header">
    <div class="header-inner">
      <div class="brand-wrap">
        <a href="/" class="brand-logo" aria-label="Zur Startseite">
          <img src="{{ url_for('static', filename='netbox_logo.svg') }}" alt="NetBox">
        </a>
        <div>
          <p class="brand-kicker">AVEMO Group Monitor</p>
          <h1 class="brand-title">NetBox IP Diff Dashboard</h1>
        </div>
      </div>
      <nav class="main-nav" aria-label="Hauptnavigation">
        <a href="/" class="nav-link {% if active_page == 'home' %}is-active{% endif %}"><i class="fa-solid fa-house"></i>Start</a>
        <a href="/snapshots" class="nav-link {% if active_page == 'snapshots' %}is-active{% endif %}"><i class="fa-solid fa-file-lines"></i>Übersicht</a>
        <a href="/diffs" class="nav-link {% if active_page == 'diffs' %}is-active{% endif %}"><i class="fa-solid fa-arrows-rotate"></i>IP Änderungen</a>
        <a href="/dns-diff" class="nav-link {% if active_page == 'dns-diff' %}is-active{% endif %}"><i class="fa-solid fa-earth-europe"></i>DNS Änderungen</a>
      </nav>
    </div>
  </header>

  <main class="page-main">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <div>
        <p class="footer-title">Eine Gruppe. Viele Standorte. Ein Anspruch.</p>
        <p class="footer-subtitle">Transparenz in NetBox, DNS und Infrastrukturzustand.</p>
      </div>
      <div class="footer-links">
        <a href="https://avemo-group.de/de" target="_blank" rel="noopener">AVEMO Group</a>
        <a href="https://netbox-aps.avemo-group.net/" target="_blank" rel="noopener">Cambium2NetBox</a>
      </div>
      <p class="footer-copy">&copy; {{ year }} AVEMO IT</p>
    </div>
  </footer>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/buttons/2.4.1/js/dataTables.buttons.min.js"></script>
  <script src="https://cdn.datatables.net/buttons/2.4.1/js/buttons.html5.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.1.3/jszip.min.js"></script>
  <script src="https://cdn.datatables.net/plug-ins/1.13.6/sorting/ip-address.js"></script>
</body>
</html>
